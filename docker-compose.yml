services:
  orbit-money:
    image: ghcr.io/waspo98/orbit-money:latest
    container_name: orbit-money
    restart: unless-stopped
    ports:
      - "${ORBIT_PORT:-5008}:5008"
    volumes:
      - budget-data:/app/data
    environment:
      PORT: "5008"
      TZ: ${TZ:-America/Chicago}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional: leave blank to auto-generate and persist in /app/data/.session_secret
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_NAME: ${SESSION_NAME:-connect.sid}
      API_KEY: ${API_KEY:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_LOGIN_LABEL: ${OIDC_LOGIN_LABEL:-Log in with OIDC}
      SIMPLEFIN_ENCRYPTION_KEY: ${SIMPLEFIN_ENCRYPTION_KEY:-}
      LOGO_DEV_PUBLISHABLE_KEY: ${LOGO_DEV_PUBLISHABLE_KEY:-}
      LOGO_DEV_SECRET_KEY: ${LOGO_DEV_SECRET_KEY:-}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      ENABLE_SAMPLE_DATA: ${ENABLE_SAMPLE_DATA:-0}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5008/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  budget-data:
    name: orbit-money-data
