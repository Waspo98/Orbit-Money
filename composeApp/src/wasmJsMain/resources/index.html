<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Orbit Money</title>
    <meta name="description" content="Local-first personal finance with fluid spring physics">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0B6E4F">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0D1310;
            color: #E2E8F0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #loading-scrim {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: radial-gradient(circle at 50% 35%, #13231A 0%, #0D1310 100%);
            z-index: 99999;
            transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
        }

        #loading-scrim.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(92, 225, 166, 0.15);
            border-top-color: #5CE1A6;
            border-radius: 50%;
            animation: orbit-spin 0.85s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .title {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #F7F9F7;
        }

        .subtitle {
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: -12px;
        }

        @keyframes orbit-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading-scrim">
        <div class="spinner"></div>
        <div class="title">Orbit Money</div>
        <div class="subtitle">Loading workspace...</div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.warn('Orbit PWA ServiceWorker registration failed:', err);
                });
            });
        }
        window.hideOrbitLoadingScrim = function() {
            var scrim = document.getElementById('loading-scrim');
            if (scrim) scrim.classList.add('hidden');
        };
    </script>
    <script src="orbitApp.js"></script>
</body>
</html>
