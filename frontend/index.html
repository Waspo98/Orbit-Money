<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1410" media="(prefers-color-scheme: dark)" />
    <title>Orbit Money</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest?v=0.75.0-20260511a" />
    <link rel="icon" href="/icon-192.png?v=0.75.0-20260511a" type="image/png" />
    <link rel="icon" href="/icon.svg?v=0.75.0-20260511a" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=0.75.0-20260511a" />

    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #fafaf7;
      }

      :root[data-theme="dark"] body {
        background: #0a1410;
      }

      :root[data-dark-variant="amoled"][data-theme="dark"] body {
        background: #000000;
      }

      .initial-splash {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #fafaf7;
      }

      :root[data-theme="dark"] .initial-splash {
        background: #0a1410;
      }

      :root[data-dark-variant="amoled"][data-theme="dark"] .initial-splash {
        background: #000000;
      }

      .initial-splash-icon {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        object-fit: cover;
        box-shadow: 0 12px 30px rgba(26, 31, 27, 0.08);
      }

      .initial-splash-wordmark {
        width: min(220px, 64vw);
        height: auto;
      }

      .initial-splash-wordmark-dark {
        display: none;
      }

      :root[data-theme="dark"] .initial-splash-wordmark-light {
        display: none;
      }

      :root[data-theme="dark"] .initial-splash-wordmark-dark {
        display: block;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) body,
        :root:not([data-theme="light"]) .initial-splash {
          background: #0a1410;
        }

        :root[data-dark-variant="amoled"]:not([data-theme="light"]) body,
        :root[data-dark-variant="amoled"]:not([data-theme="light"]) .initial-splash {
          background: #000000;
        }

        :root:not([data-theme="light"]) .initial-splash-wordmark-light {
          display: none;
        }

        :root:not([data-theme="light"]) .initial-splash-wordmark-dark {
          display: block;
        }
      }
    </style>

    <script>
      // Apply theme from localStorage before first paint to avoid flash.
      (function () {
        try {
          var saved = localStorage.getItem('orbit-money-theme') || 'system';
          var darkVariant = localStorage.getItem('orbit-money-dark-variant') || 'classic';
          if (darkVariant === 'amoled') {
            document.documentElement.setAttribute('data-dark-variant', 'amoled');
          } else {
            document.documentElement.setAttribute('data-dark-variant', 'classic');
          }
          if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (saved === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();

      // Register service worker for PWA install support.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js?v=0.75.0-20260511a', { updateViaCache: 'none' })
            .catch(function (err) {
              console.warn('Service worker registration failed:', err);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="initial-splash" role="img" aria-label="Orbit Money">
        <img class="initial-splash-icon" src="/icon-192.png?v=0.75.0-20260511a" alt="" />
        <img
          class="initial-splash-wordmark initial-splash-wordmark-light"
          src="/splash-wordmark-light.svg?v=0.75.0-20260511a"
          alt=""
        />
        <img
          class="initial-splash-wordmark initial-splash-wordmark-dark"
          src="/splash-wordmark-dark.svg?v=0.75.0-20260511a"
          alt=""
        />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
