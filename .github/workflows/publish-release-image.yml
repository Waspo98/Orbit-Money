name: Publish Release Image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: waspo98/orbit-money

jobs:
  publish:
    name: Publish tagged Docker image
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and push release image
        shell: powershell
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $image = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $parts = $version.Split(".")
          $tags = @($tag, $version)
          if ($parts.Length -ge 2) {
            $tags += "$($parts[0]).$($parts[1])"
          }

          $env:GHCR_TOKEN | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $buildArgs = @()
          foreach ($imageTag in ($tags | Select-Object -Unique)) {
            $buildArgs += @("-t", "${image}:$imageTag")
          }

          docker build @buildArgs .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($imageTag in ($tags | Select-Object -Unique)) {
            docker push "${image}:$imageTag"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
