name: Deploy Beta

on:
  push:
    branches:
      - Beta
  workflow_dispatch:

concurrency:
  group: deploy-beta
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Publish and deploy beta Docker container
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Deploy beta on home server
        shell: cmd
        working-directory: 'C:\Docker\Orbit Money'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: call "scripts\deploy-beta.cmd"
