name: Deploy Beta

on:
  push:
    branches:
      - Beta
  workflow_dispatch:

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy beta Docker container
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Deploy beta on home server
        shell: cmd
        run: call "C:\Docker\Compose\Orbit Money\scripts\deploy-beta.cmd"
