name: Deploy Beta

on:
  push:
    branches:
      - Beta
  workflow_dispatch:

concurrency:
  group: deploy-beta
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Publish and deploy beta Docker container
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Deploy beta on home server
        shell: cmd
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORBIT_PUBLISH_IMAGE: "1"
        run: call "C:\Docker\Compose\Orbit Money\scripts\deploy-beta.cmd"
