name: Deploy Live

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy live Docker container
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Deploy live on home server
        shell: cmd
        run: call "C:\Docker\Compose\Orbit Money\scripts\deploy-live.cmd"
