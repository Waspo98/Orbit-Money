name: Deploy Live

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Publish and deploy live Docker container
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Deploy live on home server
        shell: cmd
        working-directory: 'C:\Docker\Orbit Money'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: call "scripts\deploy-live.cmd"
